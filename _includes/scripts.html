<script>
/* Sidebar theme toggle — mirrors the masthead sun/moon button.
   Works alongside main.min.js setTheme(): writes localStorage so
   setTheme() on the next page load reads the correct preference. */
(function () {
  function _syncThemeIcons(isDark) {
    var mastheadIcon = document.getElementById('theme-icon');
    var sidebarIcon  = document.getElementById('sidebar-theme-icon');
    var cls = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    if (mastheadIcon) mastheadIcon.className = cls;
    if (sidebarIcon)  sidebarIcon.className  = cls;
  }

  window.toggleSiteTheme = function () {
    var html   = document.documentElement;
    var isDark = html.getAttribute('data-theme') === 'dark';
    if (isDark) {
      html.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    } else {
      html.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
    _syncThemeIcons(!isDark);
  };

  /* Set initial sidebar icon state once DOM is ready */
  document.addEventListener('DOMContentLoaded', function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    _syncThemeIcons(isDark);
  });
}());
</script>

<script>
/* Homepage: masthead turns solid once the hero scrolls away.
   All pages: sections marked .reveal fade in as they enter the viewport. */
(function () {
  var mh = document.querySelector('.masthead--overlay');
  if (mh) {
    var onScroll = function () {
      mh.classList.toggle('is-scrolled', window.scrollY > 40);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  }

  var items = document.querySelectorAll('.reveal');
  if (!items.length) { return; }
  if (!('IntersectionObserver' in window) ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    Array.prototype.forEach.call(items, function (el) { el.classList.add('is-visible'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  Array.prototype.forEach.call(items, function (el) { io.observe(el); });
}());
</script>
